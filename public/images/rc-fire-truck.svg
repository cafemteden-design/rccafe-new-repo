<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#fff4ed"/>
  <rect x="0" y="540" width="1200" height="260" fill="#f4d6a8"/>
  <g transform="translate(280 300)">
    <!-- chassis -->
    <rect x="0" y="120" width="520" height="120" rx="10" fill="#d94f00"/>
    <!-- cab -->
    <rect x="380" y="40" width="160" height="100" rx="8" fill="#ff6b1a"/>
    <rect x="400" y="60" width="100" height="60" rx="4" fill="#cfe7f5"/>
    <!-- ladder -->
    <rect x="20" y="80" width="380" height="14" rx="4" fill="#666"/>
    <g stroke="#444" stroke-width="3">
      <line x1="40" y1="80" x2="40" y2="94"/>
      <line x1="70" y1="80" x2="70" y2="94"/>
      <line x1="100" y1="80" x2="100" y2="94"/>
      <line x1="130" y1="80" x2="130" y2="94"/>
      <line x1="160" y1="80" x2="160" y2="94"/>
      <line x1="190" y1="80" x2="190" y2="94"/>
      <line x1="220" y1="80" x2="220" y2="94"/>
      <line x1="250" y1="80" x2="250" y2="94"/>
      <line x1="280" y1="80" x2="280" y2="94"/>
      <line x1="310" y1="80" x2="310" y2="94"/>
      <line x1="340" y1="80" x2="340" y2="94"/>
      <line x1="370" y1="80" x2="370" y2="94"/>
    </g>
    <!-- lights -->
    <rect x="20" y="105" width="40" height="20" rx="4" fill="#ffd700"/>
    <rect x="80" y="105" width="40" height="20" rx="4" fill="#fff"/>
    <!-- wheels -->
    <circle cx="100" cy="260" r="38" fill="#1f1f1f"/>
    <circle cx="100" cy="260" r="16" fill="#666"/>
    <circle cx="320" cy="260" r="38" fill="#1f1f1f"/>
    <circle cx="320" cy="260" r="16" fill="#666"/>
    <circle cx="460" cy="260" r="38" fill="#1f1f1f"/>
    <circle cx="460" cy="260" r="16" fill="#666"/>
  </g>
  <text x="600" y="770" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" fill="#9b7546" opacity="0.6">rc-fire-truck.jpg — replace with real photo</text>
</svg>
