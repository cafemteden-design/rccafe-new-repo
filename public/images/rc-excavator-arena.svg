<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff4ed"/>
      <stop offset="100%" stop-color="#ffe6d4"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4d6a8"/>
      <stop offset="100%" stop-color="#d9b078"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <!-- Sun glow -->
  <circle cx="980" cy="170" r="120" fill="#ffd4b3" opacity="0.6"/>
  <!-- Floor / sand arena -->
  <path d="M0 520 L1200 480 L1200 800 L0 800 Z" fill="url(#sand)"/>
  <!-- Sand piles -->
  <ellipse cx="200" cy="600" rx="170" ry="38" fill="#c89a5e"/>
  <ellipse cx="950" cy="640" rx="220" ry="44" fill="#c89a5e"/>
  <!-- Small rocks -->
  <circle cx="400" cy="660" r="14" fill="#9b7546"/>
  <circle cx="450" cy="680" r="10" fill="#9b7546"/>
  <circle cx="700" cy="700" r="12" fill="#9b7546"/>
  <circle cx="820" cy="680" r="9" fill="#9b7546"/>

  <!-- RC Excavator -->
  <g transform="translate(440 400)">
    <!-- Tracks -->
    <rect x="-10" y="180" width="320" height="50" rx="22" fill="#2a2a2a"/>
    <circle cx="30" cy="205" r="18" fill="#444"/>
    <circle cx="110" cy="205" r="18" fill="#444"/>
    <circle cx="200" cy="205" r="18" fill="#444"/>
    <circle cx="280" cy="205" r="18" fill="#444"/>
    <!-- Base -->
    <rect x="30" y="130" width="260" height="60" rx="8" fill="#ff8941"/>
    <!-- Cabin -->
    <path d="M70 130 L70 50 Q70 30 90 30 L210 30 Q230 30 230 50 L230 130 Z" fill="#ff6b1a"/>
    <!-- Window -->
    <rect x="90" y="50" width="120" height="60" rx="6" fill="#cfe7f5" opacity="0.9"/>
    <!-- Arm -->
    <path d="M230 80 L370 -30 L400 -10 L260 110 Z" fill="#ff6b1a"/>
    <path d="M370 -30 L470 90 L450 110 L350 -10 Z" fill="#ff6b1a"/>
    <!-- Bucket -->
    <path d="M440 100 Q480 110 480 150 Q480 190 440 200 Q400 200 400 160 Q400 120 440 100 Z" fill="#d94f00"/>
    <path d="M425 195 L470 200 L465 220 L420 215 Z" fill="#a93e00"/>
  </g>

  <!-- Antenna / controller floating chip -->
  <g transform="translate(120 540)">
    <rect x="0" y="0" width="120" height="80" rx="14" fill="#fff" stroke="#e8e2dc" stroke-width="2"/>
    <circle cx="30" cy="40" r="14" fill="#ff6b1a"/>
    <circle cx="90" cy="40" r="14" fill="#151515"/>
    <rect x="50" y="-20" width="6" height="22" rx="2" fill="#151515"/>
    <rect x="70" y="-20" width="6" height="22" rx="2" fill="#151515"/>
  </g>

  <text x="600" y="770" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#9b7546" opacity="0.6">rc-excavator-arena.jpg — replace with real photo</text>
</svg>
