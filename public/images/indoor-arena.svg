<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#f7f7f5"/>
  <!-- back wall -->
  <rect x="0" y="0" width="1200" height="460" fill="#ffe6d4"/>
  <!-- floor -->
  <rect x="0" y="460" width="1200" height="340" fill="#f4d6a8"/>
  <!-- arena boundary -->
  <rect x="80" y="500" width="1040" height="240" rx="20" fill="#d9b078" stroke="#a93e00" stroke-width="6" stroke-dasharray="20 12"/>
  <!-- sand piles -->
  <ellipse cx="300" cy="640" rx="120" ry="24" fill="#c89a5e"/>
  <ellipse cx="900" cy="660" rx="160" ry="28" fill="#c89a5e"/>
  <!-- mini excavator -->
  <g transform="translate(220 540)">
    <rect x="0" y="60" width="120" height="22" rx="6" fill="#2a2a2a"/>
    <rect x="20" y="30" width="80" height="40" rx="4" fill="#ff6b1a"/>
    <path d="M90 50 L150 10 L162 22 L102 62 Z" fill="#ff6b1a"/>
    <path d="M150 30 Q170 36 170 56 Q170 76 150 80 Q130 80 130 60 Z" fill="#d94f00"/>
  </g>
  <!-- mini dump truck -->
  <g transform="translate(780 560)">
    <rect x="0" y="30" width="120" height="40" rx="6" fill="#ff8941"/>
    <rect x="120" y="20" width="50" height="50" rx="6" fill="#ff6b1a"/>
    <rect x="128" y="28" width="34" height="22" rx="2" fill="#cfe7f5"/>
    <circle cx="30" cy="80" r="14" fill="#1f1f1f"/>
    <circle cx="90" cy="80" r="14" fill="#1f1f1f"/>
    <circle cx="150" cy="80" r="12" fill="#1f1f1f"/>
  </g>
  <!-- ceiling lights -->
  <g fill="#fff" stroke="#e8e2dc" stroke-width="2">
    <rect x="200" y="50" width="120" height="14" rx="3"/>
    <rect x="540" y="50" width="120" height="14" rx="3"/>
    <rect x="880" y="50" width="120" height="14" rx="3"/>
  </g>
  <!-- banner -->
  <rect x="380" y="120" width="440" height="80" rx="10" fill="#ff6b1a"/>
  <text x="600" y="172" text-anchor="middle" font-family="Inter,sans-serif" font-weight="800" font-size="36" fill="#fff" letter-spacing="2">RC CONSTRUCTION ARENA</text>

  <text x="600" y="770" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" fill="#9b7546" opacity="0.6">indoor-arena.jpg — replace with real photo</text>
</svg>
