<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="cafebg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff4ed"/>
      <stop offset="100%" stop-color="#f7f7f5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#cafebg)"/>
  <!-- floor -->
  <rect x="0" y="560" width="1200" height="240" fill="#e8e2dc"/>
  <!-- wall accent -->
  <rect x="0" y="0" width="1200" height="80" fill="#ff6b1a"/>
  <text x="60" y="55" font-family="Inter,sans-serif" font-weight="800" font-size="34" fill="#fff" letter-spacing="2">RC CAFE</text>
  <!-- shelves -->
  <rect x="80" y="180" width="320" height="14" rx="3" fill="#c89a5e"/>
  <rect x="80" y="280" width="320" height="14" rx="3" fill="#c89a5e"/>
  <!-- jars/cups on shelves -->
  <rect x="110" y="140" width="40" height="40" rx="6" fill="#ff8941"/>
  <rect x="160" y="135" width="35" height="45" rx="6" fill="#fff" stroke="#e8e2dc" stroke-width="2"/>
  <rect x="210" y="140" width="50" height="40" rx="6" fill="#1f1f1f"/>
  <rect x="270" y="138" width="40" height="42" rx="6" fill="#ff6b1a"/>
  <rect x="120" y="240" width="50" height="40" rx="6" fill="#fff" stroke="#e8e2dc" stroke-width="2"/>
  <rect x="180" y="240" width="40" height="40" rx="6" fill="#ff6b1a"/>
  <rect x="230" y="244" width="40" height="36" rx="6" fill="#1f1f1f"/>
  <rect x="280" y="240" width="60" height="40" rx="6" fill="#fff" stroke="#e8e2dc" stroke-width="2"/>

  <!-- Counter -->
  <rect x="500" y="400" width="640" height="170" rx="14" fill="#fff" stroke="#e8e2dc" stroke-width="3"/>
  <rect x="500" y="400" width="640" height="40" rx="14" fill="#1f1f1f"/>
  <!-- coffee cup -->
  <g transform="translate(560 440)">
    <path d="M0 30 L80 30 L72 110 Q70 130 50 130 L30 130 Q10 130 8 110 Z" fill="#ff6b1a"/>
    <ellipse cx="40" cy="138" rx="50" ry="6" fill="#d94f00"/>
    <path d="M80 50 Q110 50 110 80 Q110 110 80 110" stroke="#ff6b1a" stroke-width="8" fill="none"/>
    <path d="M30 0 Q22 18 30 36" stroke="#9c9c9c" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M55 0 Q47 18 55 36" stroke="#9c9c9c" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- pastries -->
  <g transform="translate(720 510)">
    <ellipse cx="0" cy="20" rx="40" ry="15" fill="#d9b078"/>
    <ellipse cx="80" cy="20" rx="40" ry="15" fill="#ff8941"/>
    <ellipse cx="160" cy="20" rx="40" ry="15" fill="#d9b078"/>
  </g>
  <!-- bubble tea -->
  <g transform="translate(960 440)">
    <rect x="0" y="0" width="60" height="120" rx="8" fill="#fff" stroke="#e8e2dc" stroke-width="2"/>
    <rect x="0" y="20" width="60" height="100" fill="#d9b078"/>
    <circle cx="15" cy="100" r="5" fill="#3a2418"/>
    <circle cx="30" cy="105" r="5" fill="#3a2418"/>
    <circle cx="45" cy="100" r="5" fill="#3a2418"/>
    <rect x="26" y="-30" width="8" height="40" fill="#ff6b1a"/>
  </g>

  <text x="600" y="770" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" fill="#9b7546" opacity="0.6">family-cafe-activity.jpg — replace with real photo</text>
</svg>
