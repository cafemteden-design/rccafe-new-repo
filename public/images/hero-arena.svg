<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fff4ed"/>
      <stop offset="100%" stop-color="#ffe6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#ffb000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffb000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1400" height="1000" fill="url(#hbg)"/>
  <rect width="1400" height="1000" fill="url(#glow)"/>
  <!-- floor -->
  <path d="M0 680 L1400 620 L1400 1000 L0 1000 Z" fill="#f4d6a8"/>
  <ellipse cx="300" cy="820" rx="280" ry="40" fill="#d9b078"/>
  <ellipse cx="1050" cy="860" rx="320" ry="46" fill="#d9b078"/>
  <!-- small rocks -->
  <circle cx="520" cy="880" r="16" fill="#9b7546"/>
  <circle cx="600" cy="910" r="12" fill="#9b7546"/>
  <circle cx="900" cy="920" r="14" fill="#9b7546"/>
  <!-- Big RC excavator -->
  <g transform="translate(520 460)">
    <rect x="0" y="240" width="420" height="64" rx="28" fill="#2a2a2a"/>
    <circle cx="50" cy="272" r="22" fill="#444"/>
    <circle cx="150" cy="272" r="22" fill="#444"/>
    <circle cx="260" cy="272" r="22" fill="#444"/>
    <circle cx="370" cy="272" r="22" fill="#444"/>
    <rect x="40" y="170" width="340" height="78" rx="10" fill="#ff8941"/>
    <path d="M90 170 L90 60 Q90 36 116 36 L270 36 Q296 36 296 60 L296 170 Z" fill="#ff6b1a"/>
    <rect x="116" y="60" width="156" height="80" rx="8" fill="#cfe7f5" opacity="0.9"/>
    <!-- arm -->
    <path d="M296 100 L490 -40 L530 -16 L336 130 Z" fill="#ff6b1a"/>
    <path d="M490 -40 L620 130 L590 156 L460 -14 Z" fill="#ff6b1a"/>
    <!-- bucket -->
    <path d="M580 140 Q640 156 640 210 Q640 264 590 280 Q540 280 540 230 Q540 180 580 140 Z" fill="#d94f00"/>
    <path d="M560 270 L630 280 L620 310 L550 300 Z" fill="#a93e00"/>
  </g>
  <!-- Bubble: coffee cup -->
  <g transform="translate(160 520)">
    <circle cx="0" cy="0" r="120" fill="#fff" stroke="#e8e2dc" stroke-width="3"/>
    <g transform="translate(-50 -60)">
      <path d="M0 30 L100 30 L92 110 Q90 130 70 130 L30 130 Q10 130 8 110 Z" fill="#ff6b1a"/>
      <ellipse cx="50" cy="138" rx="62" ry="9" fill="#d94f00"/>
      <path d="M100 50 Q130 50 130 80 Q130 110 100 110" stroke="#ff6b1a" stroke-width="10" fill="none"/>
      <path d="M30 0 Q22 18 30 36" stroke="#9c9c9c" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M55 0 Q47 18 55 36" stroke="#9c9c9c" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
  </g>
  <!-- Bubble: controller -->
  <g transform="translate(1240 320)">
    <circle cx="0" cy="0" r="100" fill="#fff" stroke="#e8e2dc" stroke-width="3"/>
    <g transform="translate(-60 -36)">
      <rect x="0" y="0" width="120" height="72" rx="14" fill="#2a2a2a"/>
      <circle cx="30" cy="36" r="14" fill="#ff6b1a"/>
      <circle cx="90" cy="36" r="14" fill="#ff6b1a"/>
      <rect x="50" y="-22" width="6" height="24" fill="#2a2a2a"/>
      <rect x="70" y="-22" width="6" height="24" fill="#2a2a2a"/>
    </g>
