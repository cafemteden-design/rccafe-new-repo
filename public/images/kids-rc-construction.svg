<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f7f5"/>
      <stop offset="100%" stop-color="#ffe6d4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg2)"/>
  <!-- floor -->
  <rect x="0" y="540" width="1200" height="260" fill="#f4d6a8"/>
  <!-- Kid silhouette holding controller -->
  <g transform="translate(220 200)">
    <!-- head -->
    <circle cx="120" cy="90" r="70" fill="#fbcfa5"/>
    <!-- hair -->
    <path d="M55 70 Q60 30 120 25 Q180 30 185 70 Q185 50 150 45 Q120 35 95 50 Q60 60 55 70 Z" fill="#3a2418"/>
    <!-- body -->
    <path d="M50 160 L190 160 L210 360 L30 360 Z" fill="#ff6b1a"/>
    <!-- arms -->
    <rect x="20" y="170" width="40" height="140" rx="18" fill="#fbcfa5"/>
    <rect x="180" y="170" width="40" height="140" rx="18" fill="#fbcfa5"/>
    <!-- legs -->
    <rect x="60" y="360" width="50" height="160" rx="12" fill="#1f1f1f"/>
    <rect x="130" y="360" width="50" height="160" rx="12" fill="#1f1f1f"/>
    <!-- Controller in hands -->
    <rect x="50" y="290" width="140" height="60" rx="14" fill="#2a2a2a"/>
    <circle cx="80" cy="320" r="10" fill="#ff6b1a"/>
    <circle cx="160" cy="320" r="10" fill="#ff6b1a"/>
    <rect x="115" y="270" width="6" height="22" fill="#2a2a2a"/>
    <rect x="130" y="270" width="6" height="22" fill="#2a2a2a"/>
  </g>
  <!-- Mini dump truck toy -->
  <g transform="translate(720 460)">
    <rect x="20" y="60" width="240" height="80" rx="10" fill="#ffb000"/>
    <path d="M260 60 L320 60 L320 140 L260 140 Z" fill="#ff6b1a"/>
    <rect x="270" y="70" width="40" height="40" rx="4" fill="#cfe7f5"/>
    <circle cx="80" cy="160" r="28" fill="#1f1f1f"/>
    <circle cx="80" cy="160" r="12" fill="#666"/>
    <circle cx="200" cy="160" r="28" fill="#1f1f1f"/>
    <circle cx="200" cy="160" r="12" fill="#666"/>
    <circle cx="290" cy="160" r="22" fill="#1f1f1f"/>
    <circle cx="290" cy="160" r="9" fill="#666"/>
  </g>
  <!-- Sand mounds -->
  <ellipse cx="600" cy="660" rx="160" ry="30" fill="#d9b078"/>
  <ellipse cx="950" cy="700" rx="200" ry="34" fill="#d9b078"/>
  <text x="600" y="770" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" fill="#9b7546" opacity="0.6">kids-rc-construction.jpg — replace with real photo</text>
</svg>
